# Lets a maintainer ask for an issue to be assessed and, if it is real and reproducible,
# fixed as a pull request, ready for review, by the shared workflow of
# menil/pr-code-review-action (pinned to the v1.8.0 commit). Read "Issue implementation" in that
# repository's README first. It needs the repository setting "Allow GitHub Actions to create
# and approve pull requests", it uses the Claude subscription token, and the model only ever
# runs the commands named below.
#
# It starts only when someone with write access applies the ready-to-implement label. To
# have a maintainer's own new issues worked on automatically, set the repository variable
# AGENT_AUTO to true; it is off. Add the no-agent label to keep the agent off an issue.
#
# The jobs, the guard and what each job may touch are in that shared workflow, so this file
# changes only for this repository's own settings, and for the version on the `uses:` line,
# which Dependabot bumps.
name: Implement issue

on:
  issues:
    types: [opened, labeled]

# Nothing by default; the one job below asks for what the jobs it calls need between them.
permissions: {}

# One run per issue, queued and never cancelled halfway.
concurrency:
  group: implement-issue-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  implement:
    # The most the called jobs need between them. Each of them asks for less, and none asks
    # for `workflows`.
    permissions:
      contents: write
      issues: write
      pull-requests: write
    uses: menil/pr-code-review-action/.github/workflows/implement.yml@e221ab244b89b41b39abf18d9d37fa4ecdc6c825 # v1.8.0
    with:
      agent_auto: ${{ vars.AGENT_AUTO }}
      daily_cap: ${{ vars.AGENT_DAILY_CAP }}
      # The tests need the PDFium library, which only the Nix shell provides.
      install_nix: true
      assess_command_tools: "Bash(nix-shell --run 'just test')"
      # The tests, and the formatting and clippy checks, so the change can be made to pass
      # what the project's own validation will ask.
      fix_command_tools: "Bash(nix-shell --run 'just test'),Bash(nix-shell --run 'just lint')"
      repository_notes: |
        pdf-vdiff is a Rust command line tool that compares two PDFs visually. The code
        is in src/, integration tests are in tests/ and sample PDFs are in example/.
        Tests need the PDFium library, which only the Nix shell provides, and they run
        single-threaded. Run them with `nix-shell --run 'just test'`, exactly like that.
      fix_repository_notes: |
        pdf-vdiff is a Rust command line tool that compares two PDFs visually. The code
        is in src/, integration tests are in tests/ and sample PDFs are in example/.
        Tests need the PDFium library, which only the Nix shell provides, and they run
        single-threaded. Run them with `nix-shell --run 'just test'`, and check
        formatting and clippy with `nix-shell --run 'just lint'`, exactly like that.
        Add a regression test next to the existing ones for any behaviour you change.
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

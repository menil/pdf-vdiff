name: Publish to Crates.io

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    name: Publish Crate
    runs-on: ubuntu-latest
    if: github.repository == 'menil/pdf-vdiff'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Publish to Crates.io
        id: publish
        uses: katyo/publish-crates@v2
        with:
          registry-token: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          ignore-unpublished-changes: true

      # katyo/publish-crates returns a serialized JSON array of published packages
      # (e.g. '[{"name":"pdf-vdiff","version":"0.1.0"}]' when published, '[]' when skipped).
      - name: Create Git Tag and GitHub Release
        if: steps.publish.outputs.published != '' && steps.publish.outputs.published != '[]'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          TAG="v${VERSION}"
          echo "Published new version $VERSION to Crates.io. Creating release $TAG..."
          gh release create "$TAG" --title "$TAG" --generate-notes

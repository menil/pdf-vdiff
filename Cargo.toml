[package]
name = "pdf-vdiff"
version = "0.1.3"
edition = "2021"
authors = ["Meni Livne <meni@livne.org>"]
description = "A fast, standalone CLI tool for side-by-side visual PDF diffing"
readme = "README.md"
license = "MIT"
repository = "https://github.com/menil/pdf-vdiff"
homepage = "https://github.com/menil/pdf-vdiff"
keywords = ["pdf", "diff", "visual-diff", "resume", "vector"]
categories = ["command-line-utilities", "text-processing"]

[lib]
name = "pdf_vdiff"
path = "src/lib.rs"

[[bin]]
name = "pdf-vdiff"
path = "src/main.rs"

[[bin]]
name = "generate-assets"
path = "src/bin/generate_assets.rs"

[dependencies]
clap = { version = "4", features = ["derive", "cargo"] }
clap_complete = "4"
clap_mangen = "0.2"
pdfium-render = "0.9"
similar = { version = "2", features = ["unicode"] }
unicode-normalization = "0.1"
thiserror = "1"
anyhow = "1"
open = "5"
tempfile = "3"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
